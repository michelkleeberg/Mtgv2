<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTG Art">
<meta name="theme-color" content="#000000">
<title>MTG Art Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    user-select: none;
  }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: pan-x pan-y pinch-zoom;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #art {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.4s ease;
    user-select: none;
    -webkit-user-drag: none;
  }
  #art.loaded { opacity: 1; }

  #loader {
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: rgba(255,255,255,0.6);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  #loader.show { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #info {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    letter-spacing: 0.02em;
    display: flex;
    flex-direction: column;
    gap: 2px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  #info.show { opacity: 1; transform: translateY(0); }
  #info .name { font-size: 15px; font-weight: 600; color: #fff; }
  #info .flavor {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    line-height: 1.4;
    color: rgba(255,255,255,0.45);
    margin: 4px 0 2px;
    max-width: 92%;
  }
  #info .meta { font-size: 12px; color: rgba(255,255,255,0.55); }

  #hint {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top));
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #hint.hide { opacity: 0; }

  #error {
    position: fixed;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    text-align: center;
    padding: 0 24px;
    display: none;
    line-height: 1.5;
  }
  #error.show { display: block; }

  /* Settings gear */
  #settings-btn {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.55);
    font-size: 16px;
    z-index: 20;
    transition: background 0.2s ease, color 0.2s ease;
  }
  #settings-btn:active { background: rgba(255,255,255,0.14); color: #fff; }


  #hd-btn {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    right: 56px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.55);
    font-size: 17px;
    z-index: 20;
    transition: background 0.2s ease, color 0.2s ease;
  }
  #hd-btn:active { background: rgba(255,255,255,0.14); color: #fff; }

  #hd-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #hd-overlay.show { opacity: 1; pointer-events: auto; }
  #hd-img {
    max-width: 92vw;
    max-height: 85vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #hd-img.loaded { opacity: 1; }
  #hd-loader {
    position: absolute;
    width: 22px; height: 22px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  #hd-loader.show { opacity: 1; }
  #hd-close {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 51;
  }
  #hd-close:active { background: rgba(255,255,255,0.2); }

  .edge-zone {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 50%;
    z-index: 15;
  }
  #zone-prev { left: 0; width: 20%; }
  #zone-next { right: 0; width: 20%; left: auto; }

  .edge-icon {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.28);
    font-size: 22px;
    pointer-events: none;
    z-index: 16;
    transition: opacity 0.6s ease;
  }
  .edge-icon.hide { opacity: 0; }
  .edge-icon.disabled { opacity: 0.1; }
  #icon-prev { left: 14px; }
  #icon-next { right: 14px; }

  /* Settings panel */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }

  #panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #0d0d0d;
    border-top: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px 18px 0 0;
    padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
    z-index: 31;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    max-height: 80vh;
    overflow-y: auto;
  }
  #panel.show { transform: translateY(0); }

  #panel h2 {
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  #panel .sub {
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    margin-bottom: 20px;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .field input[type="text"], .field input[type="number"] {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 11px 12px;
    color: #fff;
    font-size: 15px;
    outline: none;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
    user-select: text;
  }
  .field input::placeholder { color: rgba(255,255,255,0.3); }
  .field input:focus { border-color: rgba(255,255,255,0.35); }

  .field.autocomplete { position: relative; }
  .ac-list {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 4px);
    background: #16161a;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    max-height: 180px;
    overflow-y: auto;
    z-index: 5;
    display: none;
  }
  .ac-list.show { display: block; }
  .ac-item {
    padding: 10px 12px;
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:active { background: rgba(255,255,255,0.08); }

  .year-row { display: flex; gap: 10px; align-items: center; }
  .year-row input { flex: 1; }
  .year-row span { color: rgba(255,255,255,0.35); font-size: 13px; }

  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }
  .btn-primary { background: #fff; color: #000; }
  .btn-primary:active { background: rgba(255,255,255,0.85); }
  .btn-secondary { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }
  .btn-secondary:active { background: rgba(255,255,255,0.15); }

  #active-filters {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    margin-top: 4px;
    min-height: 14px;
  }

  #more-artist-btn {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.55);
    text-decoration: underline;
    background: none;
    border: none;
    padding: 4px 0;
    pointer-events: auto;
    z-index: 25;
    position: relative;
    display: none;
  }
  #more-artist-btn.show { display: inline-block; }
  #more-artist-btn:active { color: #fff; }

  #back-filters-btn {
    position: fixed;
    top: calc(56px + env(safe-area-inset-top));
    right: 14px;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.55);
    text-decoration: underline;
    background: none;
    border: none;
    padding: 4px 2px;
    z-index: 20;
    display: none;
  }
  #back-filters-btn.show { display: inline-block; }
  #back-filters-btn:active { color: #fff; }

  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 5px 6px 5px 12px;
    font-size: 12px;
    color: #fff;
  }
  .chip button {
    background: none;
    border: none;
    color: rgba(255,255,255,0.55);
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
  }
  .chip button:active { color: #fff; }
</style>
</head>
<body>
  <div id="stage">
    <img id="art" alt="">
    <div id="loader"></div>
    <div id="error">No hay cartas con esos filtros.<br>Ajusta la edición o el rango de años.</div>
  </div>
  <div id="hint">Toque corto en el borde izq/der: cambiar carta · Mantén presionado: activa/desactiva info</div>
  <div id="info">
    <div class="name" id="info-name"></div>
    <div class="flavor" id="info-flavor"></div>
    <div class="meta" id="info-meta"></div>
    <button id="more-artist-btn">Más de este artista</button>
  </div>

  <button id="back-filters-btn">Volver</button>

  <button id="hd-btn" aria-label="Ver carta completa en HD">ⓘ</button>
  <button id="settings-btn" aria-label="Configuración">⚙</button>

  <div id="hd-overlay">
    <img id="hd-img" alt="">
    <div id="hd-loader"></div>
    <button id="hd-close" aria-label="Cerrar">×</button>
  </div>
  <div id="zone-prev" class="edge-zone"></div>
  <div id="zone-next" class="edge-zone"></div>
  <div id="icon-prev" class="edge-icon disabled">‹</div>
  <div id="icon-next" class="edge-icon">›</div>

  <div id="overlay"></div>
  <div id="panel">
    <h2>Filtros</h2>
    <div class="sub">Deja los campos vacíos para no filtrar.</div>

    <div class="field autocomplete">
      <label for="name-input">Nombre de la carta</label>
      <input type="text" id="name-input" placeholder="ej: Consecrated Sphinx" autocomplete="off">
      <div class="ac-list" id="name-ac"></div>
    </div>

    <div class="field autocomplete">
      <label for="artist-input">Artista</label>
      <input type="text" id="artist-input" placeholder="ej: Rebecca Guay" autocomplete="off">
      <div class="ac-list" id="artist-ac"></div>
    </div>

    <div class="field autocomplete">
      <label for="sets-input">Ediciones</label>
      <div class="chip-list" id="sets-chips"></div>
      <input type="text" id="sets-input" placeholder="Escribe para buscar una edición..." autocomplete="off">
      <div class="ac-list" id="sets-ac"></div>
    </div>

    <div class="field">
      <label>Rango de años</label>
      <div class="year-row">
        <input type="number" id="year-from" placeholder="Desde" inputmode="numeric">
        <span>—</span>
        <input type="number" id="year-to" placeholder="Hasta" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label for="keywords-input">Palabras clave (busca en el texto de la carta)</label>
      <input type="text" id="keywords-input" placeholder="ej: phyrexian, vampire">
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="clear-btn">Clean</button>
      <button class="btn btn-primary" id="apply-btn">Aplicar</button>
    </div>
    <div id="active-filters"></div>

    <div class="btn-row" style="margin-top: 14px;">
      <button class="btn btn-secondary" id="download-btn">⬇ Descargar carta actual</button>
    </div>
  </div>

<script>
(function () {
  var art = document.getElementById('art');
  var loader = document.getElementById('loader');
  var errorEl = document.getElementById('error');
  var hint = document.getElementById('hint');
  var info = document.getElementById('info');
  var infoName = document.getElementById('info-name');
  var infoFlavor = document.getElementById('info-flavor');
  var infoMeta = document.getElementById('info-meta');

  var settingsBtn = document.getElementById('settings-btn');
  var downloadBtn = document.getElementById('download-btn');
  var hdBtn = document.getElementById('hd-btn');
  var hdOverlay = document.getElementById('hd-overlay');
  var hdImg = document.getElementById('hd-img');
  var hdClose = document.getElementById('hd-close');
  var zonePrev = document.getElementById('zone-prev');
  var zoneNext = document.getElementById('zone-next');
  var iconPrev = document.getElementById('icon-prev');
  var iconNext = document.getElementById('icon-next');
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');
  var nameInput = document.getElementById('name-input');
  var artistInput = document.getElementById('artist-input');
  var nameAc = document.getElementById('name-ac');
  var artistAc = document.getElementById('artist-ac');
  var setsInput = document.getElementById('sets-input');
  var setsChipsEl = document.getElementById('sets-chips');
  var setsAc = document.getElementById('sets-ac');
  var yearFrom = document.getElementById('year-from');
  var yearTo = document.getElementById('year-to');
  var keywordsInput = document.getElementById('keywords-input');
  var applyBtn = document.getElementById('apply-btn');
  var clearBtn = document.getElementById('clear-btn');
  var activeFiltersEl = document.getElementById('active-filters');
  var moreArtistBtn = document.getElementById('more-artist-btn');

  var STORAGE_KEY = 'mtg-viewer-filters';
  var loading = false;
  var activeArtistFilter = ''; // lowercase artist name currently applied as a filter, if any

  var DEFAULT_FILTERS = { name: '', artist: '', sets: '', yearFrom: '', yearTo: '', keywords: '' };

  function loadFilters() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      return {
        name: parsed.name || '',
        artist: parsed.artist || '',
        sets: parsed.sets || '',
        yearFrom: parsed.yearFrom || '',
        yearTo: parsed.yearTo || '',
        keywords: parsed.keywords || ''
      };
    } catch (e) {
      return Object.assign({}, DEFAULT_FILTERS);
    }
  }

  function saveFilters(f) {
    activeArtistFilter = (f.artist || '').trim().toLowerCase();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(f)); } catch (e) {}
  }

  var setsChips = [];

  function currentFilters() {
    return {
      name: nameInput.value.trim(),
      artist: artistInput.value.trim(),
      sets: setsChips.join(','),
      yearFrom: yearFrom.value.trim(),
      yearTo: yearTo.value.trim(),
      keywords: keywordsInput.value.trim()
    };
  }

  function applyFiltersToInputs(f) {
    nameInput.value = f.name || '';
    artistInput.value = f.artist || '';
    setsChips = (f.sets || '').split(',').map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
    setsInput.value = '';
    renderSetsChips();
    yearFrom.value = f.yearFrom || '';
    yearTo.value = f.yearTo || '';
    keywordsInput.value = f.keywords || '';
  }

  function buildQuery(f) {
    var parts = [];
    if (f.name) parts.push('name:"' + f.name.replace(/"/g, '') + '"');
    if (f.artist) parts.push('artist:"' + f.artist.replace(/"/g, '') + '"');
    if (f.sets) {
      var codes = f.sets.split(',').map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
      if (codes.length) {
        var setQuery = codes.map(function (c) { return 'e:' + c; }).join(' or ');
        parts.push(codes.length > 1 ? '(' + setQuery + ')' : setQuery);
      }
    }
    if (f.yearFrom) parts.push('year>=' + f.yearFrom);
    if (f.yearTo) parts.push('year<=' + f.yearTo);
    if (f.keywords) {
      var words = f.keywords.split(',').map(function (w) { return w.trim(); }).filter(Boolean);
      if (words.length) {
        var wordQuery = words.map(function (w) { return 'o:"' + w.replace(/"/g, '') + '"'; }).join(' or ');
        parts.push(words.length > 1 ? '(' + wordQuery + ')' : wordQuery);
      }
    }
    return parts.join(' ');
  }

  function describeFilters(f) {
    var bits = [];
    if (f.name) bits.push(f.name);
    if (f.artist) bits.push(f.artist);
    if (f.sets) bits.push(f.sets.split(',').map(function (s) { return s.trim().toUpperCase(); }).join(', '));
    if (f.yearFrom || f.yearTo) bits.push((f.yearFrom || '…') + '–' + (f.yearTo || '…'));
    if (f.keywords) bits.push(f.keywords.split(',').map(function (w) { return w.trim(); }).join(', '));
    return bits.length ? bits.join(' · ') : '';
  }

  function hideHintSoon() {
    setTimeout(function () {
      hint.classList.add('hide');
      iconPrev.classList.add('hide');
      iconNext.classList.add('hide');
    }, 3000);
  }

  function pickImageUrl(card) {
    if (card.image_uris) {
      return card.image_uris.art_crop || card.image_uris.large || card.image_uris.normal || card.image_uris.png;
    }
    if (card.card_faces && card.card_faces.length) {
      var face = card.card_faces.find(function (f) { return f.image_uris; });
      if (face) {
        return face.image_uris.art_crop || face.image_uris.large || face.image_uris.normal;
      }
    }
    return null;
  }

  function pickFlavorText(card) {
    if (card.flavor_text) return card.flavor_text;
    if (card.card_faces && card.card_faces.length) {
      var face = card.card_faces.find(function (f) { return f.flavor_text; });
      if (face) return face.flavor_text;
    }
    return '';
  }

  function pickFullCardUrl(card) {
    // Prefers png (Scryfall's highest-resolution image) of the entire card, not just the art crop.
    if (card.image_uris) {
      return card.image_uris.png || card.image_uris.large || card.image_uris.normal;
    }
    if (card.card_faces && card.card_faces.length) {
      var face = card.card_faces.find(function (f) { return f.image_uris; });
      if (face) {
        return face.image_uris.png || face.image_uris.large || face.image_uris.normal;
      }
    }
    return null;
  }

  var history = [];
  var historyIndex = -1;

  function renderEntry(entry) {
    // Update text/metadata immediately so it never lags behind the visible art.
    infoName.textContent = entry.name;
    infoFlavor.textContent = entry.flavor;
    infoFlavor.style.display = entry.flavor ? '' : 'none';
    infoMeta.textContent = entry.meta;
    var alreadyFilteredToThisArtist = entry.artist && activeArtistFilter && entry.artist.trim().toLowerCase() === activeArtistFilter;
    moreArtistBtn.classList.toggle('show', !!entry.artist && !alreadyFilteredToThisArtist);

    art.classList.remove('loaded');
    var img = new Image();
    img.onload = function () {
      art.src = entry.imgUrl;
      art.classList.add('loaded');
      loader.classList.remove('show');
      loading = false;
      updateNavButtons();
    };
    img.onerror = function () {
      loading = false;
      updateNavButtons();
    };
    img.src = entry.imgUrl;
  }

  function updateNavButtons() {
    iconPrev.classList.toggle('disabled', historyIndex <= 0);
  }

  function fetchNext() {
    if (loading) return;
    loading = true;
    errorEl.classList.remove('show');
    loader.classList.add('show');
    art.classList.remove('loaded');

    var filters = loadFilters();
    var query = buildQuery(filters);
    var url = 'https://api.scryfall.com/cards/random' + (query ? '?q=' + encodeURIComponent(query) : '');

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('Scryfall error ' + res.status);
        return res.json();
      })
      .then(function (card) {
        var imgUrl = pickImageUrl(card);
        if (!imgUrl) {
          loading = false;
          return fetchNext();
        }
        var flavor = pickFlavorText(card);
        var entry = {
          imgUrl: imgUrl,
          fullCardUrl: pickFullCardUrl(card),
          name: card.name,
          artist: card.artist || '',
          flavor: flavor ? '"' + flavor.replace(/\n/g, ' ') + '"' : '',
          meta: (card.set_name || '') + (card.artist ? ' · Art by ' + card.artist : '')
        };
        // Discard any "forward" history if we branched off after going back.
        history = history.slice(0, historyIndex + 1);
        history.push(entry);
        historyIndex = history.length - 1;
        renderEntry(entry);
        translateFlavorToSpanish(card, entry);
      })
      .catch(function () {
        loading = false;
        loader.classList.remove('show');
        errorEl.classList.add('show');
      });
  }

  function translateFlavorToSpanish(card, entry) {
    if (!card.oracle_id) return;
    var q = 'oracleid:' + card.oracle_id + ' lang:es';
    var url = 'https://api.scryfall.com/cards/search?order=released&unique=prints&q=' + encodeURIComponent(q);

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('no es prints');
        return res.json();
      })
      .then(function (data) {
        var prints = (data && data.data) || [];
        var withFlavor = prints.find(function (c) { return pickFlavorText(c); });
        var esFlavor = withFlavor ? pickFlavorText(withFlavor) : null;
        if (!esFlavor) return;
        entry.flavor = '"' + esFlavor.replace(/\n/g, ' ') + '"';
        // If this card is still the one on screen, update it live.
        if (history[historyIndex] === entry) {
          infoFlavor.textContent = entry.flavor;
          infoFlavor.style.display = '';
        }
      })
      .catch(function () {
        // No hay impresión en español o falló la búsqueda: se conserva el flavor text original.
      });
  }

  function goNext() {
    if (historyIndex < history.length - 1) {
      historyIndex++;
      loader.classList.add('show');
      renderEntry(history[historyIndex]);
    } else {
      fetchNext();
    }
  }

  function goPrev() {
    if (historyIndex > 0) {
      historyIndex--;
      loader.classList.add('show');
      renderEntry(history[historyIndex]);
    }
  }

  function resetHistoryAndLoad() {
    history = [];
    historyIndex = -1;
    updateNavButtons();
    fetchNext();
  }

  function toggleInfo(show) {
    info.classList.toggle('show', show);
  }

  var pressTimer = null;
  var longPressed = false;
  var HOLD_MS = 350;

  // Track how many fingers are on screen. While pinching (2+ fingers),
  // suppress tap/hold navigation so zoom doesn't accidentally change the card.
  var activePointers = new Set();
  var multiTouch = false;
  document.addEventListener('pointerdown', function (e) {
    activePointers.add(e.pointerId);
    if (activePointers.size > 1) {
      multiTouch = true;
      clearTimeout(pressTimer);
    }
  }, true);
  function releasePointer(e) {
    activePointers.delete(e.pointerId);
    if (activePointers.size === 0) {
      setTimeout(function () { multiTouch = false; }, 250);
    }
  }
  document.addEventListener('pointerup', releasePointer, true);
  document.addEventListener('pointercancel', releasePointer, true);

  function attachZone(zone, action) {
    zone.addEventListener('pointerdown', function () {
      if (multiTouch) return;
      longPressed = false;
      pressTimer = setTimeout(function () {
        longPressed = true;
        toggleInfo(!info.classList.contains('show'));
      }, HOLD_MS);
    });
    zone.addEventListener('pointerup', function () {
      clearTimeout(pressTimer);
      if (multiTouch) return;
      if (!longPressed) {
        action();
      }
    });
    zone.addEventListener('pointerleave', function () {
      clearTimeout(pressTimer);
    });
  }

  attachZone(zonePrev, goPrev);
  attachZone(zoneNext, goNext);

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Download: try the native share sheet (lets iOS save straight to Photos,
  // no browser tab involved). Falls back to opening the raw image if unsupported.
  var downloading = false;
  function downloadCurrent() {
    if (downloading) return;
    var entry = history[historyIndex];
    if (!entry) return;
    var url = entry.imgUrl;

    if (navigator.share && navigator.canShare) {
      downloading = true;
      fetch(url)
        .then(function (res) { return res.blob(); })
        .then(function (blob) {
          var fileName = (entry.name || 'mtg-art').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.jpg';
          var file = new File([blob], fileName, { type: blob.type || 'image/jpeg' });
          if (navigator.canShare({ files: [file] })) {
            return navigator.share({ files: [file], title: entry.name || 'MTG Art' });
          }
          throw new Error('share not supported for files');
        })
        .catch(function () {
          window.open(url, '_blank', 'noopener,noreferrer');
        })
        .finally(function () { downloading = false; });
    } else {
      window.open(url, '_blank', 'noopener,noreferrer');
    }
  }
  downloadBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    downloadCurrent();
  });

  // HD full-card modal
  var hdLoader = document.getElementById('hd-loader');
  function openHD() {
    var entry = history[historyIndex];
    if (!entry || !entry.fullCardUrl) return;
    hdImg.classList.remove('loaded');
    hdLoader.classList.add('show');
    hdOverlay.classList.add('show');
    var img = new Image();
    img.onload = function () {
      hdImg.src = entry.fullCardUrl;
      hdImg.classList.add('loaded');
      hdLoader.classList.remove('show');
    };
    img.onerror = function () {
      hdLoader.classList.remove('show');
    };
    img.src = entry.fullCardUrl;
  }
  function closeHD() {
    hdOverlay.classList.remove('show');
  }
  hdBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    openHD();
  });
  hdClose.addEventListener('click', function (e) {
    e.stopPropagation();
    closeHD();
  });
  hdOverlay.addEventListener('click', function (e) {
    if (e.target === hdOverlay) closeHD();
  });

  // Settings panel
  function openPanel() {
    applyFiltersToInputs(loadFilters());
    overlay.classList.add('show');
    panel.classList.add('show');
  }
  function closePanel() {
    overlay.classList.remove('show');
    panel.classList.remove('show');
  }

  settingsBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    openPanel();
  });
  overlay.addEventListener('click', closePanel);
  panel.addEventListener('click', function (e) { e.stopPropagation(); });

  // --- Autocomplete: card name (Scryfall's own autocomplete endpoint) ---
  function debounce(fn, ms) {
    var t = null;
    return function () {
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, ms);
    };
  }

  function showSuggestions(listEl, items, onPick) {
    listEl.innerHTML = '';
    if (!items.length) { listEl.classList.remove('show'); return; }
    items.slice(0, 8).forEach(function (item) {
      var label = typeof item === 'string' ? item : item.label;
      var value = typeof item === 'string' ? item : item.value;
      var div = document.createElement('div');
      div.className = 'ac-item';
      div.textContent = label;
      div.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        onPick(value);
        listEl.classList.remove('show');
      });
      listEl.appendChild(div);
    });
    listEl.classList.add('show');
  }

  var fetchNameSuggestions = debounce(function (value) {
    if (!value) { nameAc.classList.remove('show'); return; }
    fetch('https://api.scryfall.com/cards/autocomplete?q=' + encodeURIComponent(value))
      .then(function (res) { return res.ok ? res.json() : { data: [] }; })
      .then(function (data) {
        showSuggestions(nameAc, data.data || [], function (label) {
          nameInput.value = label;
        });
      })
      .catch(function () {});
  }, 200);

  nameInput.addEventListener('input', function () {
    fetchNameSuggestions(nameInput.value.trim());
  });
  nameInput.addEventListener('blur', function () {
    setTimeout(function () { nameAc.classList.remove('show'); }, 150);
  });

  // --- Autocomplete: artist (fetched once from Scryfall's artist catalog, filtered locally) ---
  var artistCatalog = null;
  function ensureArtistCatalog(callback) {
    if (artistCatalog) return callback(artistCatalog);
    fetch('https://api.scryfall.com/catalog/artist-names')
      .then(function (res) { return res.ok ? res.json() : { data: [] }; })
      .then(function (data) {
        artistCatalog = data.data || [];
        callback(artistCatalog);
      })
      .catch(function () { artistCatalog = []; callback(artistCatalog); });
  }

  artistInput.addEventListener('focus', function () { ensureArtistCatalog(function () {}); });
  artistInput.addEventListener('input', function () {
    var value = artistInput.value.trim().toLowerCase();
    if (!value) { artistAc.classList.remove('show'); return; }
    ensureArtistCatalog(function (list) {
      var matches = list.filter(function (n) { return n.toLowerCase().indexOf(value) !== -1; });
      showSuggestions(artistAc, matches, function (label) {
        artistInput.value = label;
      });
    });
  });
  artistInput.addEventListener('blur', function () {
    setTimeout(function () { artistAc.classList.remove('show'); }, 150);
  });

  // --- Ediciones: chips + autocomplete (catálogo completo de sets, una sola descarga) ---
  var setsCatalog = null;
  function ensureSetsCatalog(callback) {
    if (setsCatalog) return callback(setsCatalog);
    fetch('https://api.scryfall.com/sets')
      .then(function (res) { return res.ok ? res.json() : { data: [] }; })
      .then(function (data) {
        setsCatalog = data.data || [];
        callback(setsCatalog);
      })
      .catch(function () { setsCatalog = []; callback(setsCatalog); });
  }

  function renderSetsChips() {
    setsChipsEl.innerHTML = '';
    setsChips.forEach(function (code) {
      var chip = document.createElement('div');
      chip.className = 'chip';
      var label = document.createElement('span');
      label.textContent = code.toUpperCase();
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setsChips = setsChips.filter(function (c) { return c !== code; });
        renderSetsChips();
        var f = currentFilters();
        saveFilters(f);
        activeFiltersEl.textContent = describeFilters(f);
        resetHistoryAndLoad();
      });
      chip.appendChild(label);
      chip.appendChild(removeBtn);
      setsChipsEl.appendChild(chip);
    });
  }

  function addSetChip(code) {
    code = (code || '').trim().toLowerCase();
    if (!code || setsChips.indexOf(code) !== -1) return;
    setsChips.push(code);
    setsInput.value = '';
    renderSetsChips();
  }

  setsInput.addEventListener('focus', function () { ensureSetsCatalog(function () {}); });
  setsInput.addEventListener('input', function () {
    var value = setsInput.value.trim().toLowerCase();
    if (!value) { setsAc.classList.remove('show'); return; }
    ensureSetsCatalog(function (list) {
      var matches = list
        .filter(function (s) {
          return s.name.toLowerCase().indexOf(value) !== -1 || s.code.toLowerCase().indexOf(value) !== -1;
        })
        .map(function (s) { return { label: s.name + ' (' + s.code.toUpperCase() + ')', value: s.code }; });
      showSuggestions(setsAc, matches, addSetChip);
    });
  });
  setsInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && setsInput.value.trim()) {
      e.preventDefault();
      addSetChip(setsInput.value);
      setsAc.classList.remove('show');
    }
  });
  setsInput.addEventListener('blur', function () {
    setTimeout(function () { setsAc.classList.remove('show'); }, 150);
  });

  // --- "More from this artist" ---
  var backFiltersBtn = document.getElementById('back-filters-btn');
  var previousFilters = null;

  moreArtistBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  moreArtistBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var entry = history[historyIndex];
    if (!entry || !entry.artist) return;
    previousFilters = loadFilters();
    var f = Object.assign({}, DEFAULT_FILTERS, { artist: entry.artist });
    saveFilters(f);
    applyFiltersToInputs(f);
    activeFiltersEl.textContent = describeFilters(f);
    toggleInfo(false);
    backFiltersBtn.classList.add('show');
    resetHistoryAndLoad();
  });

  backFiltersBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!previousFilters) return;
    saveFilters(previousFilters);
    applyFiltersToInputs(previousFilters);
    activeFiltersEl.textContent = describeFilters(previousFilters);
    previousFilters = null;
    backFiltersBtn.classList.remove('show');
    resetHistoryAndLoad();
  });

  applyBtn.addEventListener('click', function () {
    var f = currentFilters();
    saveFilters(f);
    activeFiltersEl.textContent = describeFilters(f);
    previousFilters = null;
    backFiltersBtn.classList.remove('show');
    closePanel();
    resetHistoryAndLoad();
  });

  clearBtn.addEventListener('click', function () {
    var empty = Object.assign({}, DEFAULT_FILTERS);
    applyFiltersToInputs(empty);
    saveFilters(empty);
    activeFiltersEl.textContent = '';
    previousFilters = null;
    backFiltersBtn.classList.remove('show');
    closePanel();
    resetHistoryAndLoad();
  });

  // Init
  var initialFilters = loadFilters();
  applyFiltersToInputs(initialFilters);
  activeFiltersEl.textContent = describeFilters(initialFilters);
  activeArtistFilter = (initialFilters.artist || '').trim().toLowerCase();
  updateNavButtons();
  hideHintSoon();
  fetchNext();
})();
</script>
</body>
</html>
